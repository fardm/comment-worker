<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'">
    <title>Comment System Admin</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/admin.css">
</head>
<body>

    <!-- ── Login screen ──────────────────────────────────────────────────── -->
    <div id="login-section">
        <h2 style="margin-bottom: 1.5rem;">Admin Login</h2>
        <div id="login-message"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
    </div>

    <!-- ── Authenticated shell ────────────────────────────────────────────── -->
    <div id="admin-shell" style="display:none;">

        <!-- Sidebar Navigation -->
        <aside id="admin-sidebar" class="sidebar">
            <div class="sidebar-header">
                <h2>Admin Panel</h2>
                <button class="mobile-menu-toggle" aria-label="Toggle menu" onclick="document.getElementById('admin-sidebar').classList.toggle('active')">
                    <svg viewBox="0 0 24 24" class="icon-svg"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"></path></svg>
                </button>
            </div>
            <nav id="admin-nav" class="nav sidebar-nav"></nav>
        </aside>

        <!-- Main Content Area -->
        <div class="main-content">
            <header id="admin-header">
                <div class="header-left">
                    <button class="mobile-menu-toggle" aria-label="Toggle menu" onclick="document.getElementById('admin-sidebar').classList.toggle('active')">
                        <svg viewBox="0 0 24 24" class="icon-svg"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"></path></svg>
                    </button>
                    <h1>Dashboard</h1>
                </div>

                <div class="section-icons">
                    <label class="theme-switch">
                        <input type="checkbox" id="toggle-switch">
                        <div id="toggle-icon" class="header-icon"></div>
                    </label>
                </div>
            </header>

            <!-- Page content is mounted here -->
            <div id="app"></div>
        </div>
    </div>

    <!-- ── Shared scripts ─────────────────────────────────────────────────── -->
    <script src="assets/admin-common.js"></script>
    <script src="assets/admin-comment-edit.js"></script>
    <script src="assets/admin-app.js"></script>
    <script src="assets/light-dark-mode-panel.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-ancestors 'none'">
    <title>Comment System Admin</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="assets/admin.css">
</head>
<body>

    <!-- ── Login screen ──────────────────────────────────────────────────── -->
    <div id="login-section">
        <h2 style="margin-bottom: 1.5rem;">Admin Login</h2>
        <div id="login-message"></div>
        <form id="login-form">
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
        </form>
    </div>

    <!-- ── Authenticated shell ────────────────────────────────────────────── -->
    <div id="admin-shell" style="display:none;">
        <header id="admin-header">
            <h1>Comment System Admin</h1>
            <nav id="admin-nav" class="nav"></nav>
            <div class="section-icons">
                <label class="theme-switch">
                    <input type="checkbox" id="toggle-switch">
                    <div id="toggle-icon" class="header-icon"></div>
                </label>
            </div>
        </header>

        <!-- Page content is mounted here -->
        <div id="app"></div>
    </div>

    <!-- ── Shared scripts ─────────────────────────────────────────────────── -->
    <script src="assets/admin-common.js"></script>
    <script src="assets/admin-comment-edit.js"></script>
    <script src="assets/admin-app.js"></script>
    <script src="assets/light-dark-mode-panel.js"></script>
</body>
</html>
